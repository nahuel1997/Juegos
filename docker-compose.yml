services:
  api:
    build: ./api
    restart: unless-stopped
    environment:
      JWT_SECRET: ${JWT_SECRET:?Falta JWT_SECRET en .env}
      # Poner false solo si se sirve por HTTP plano (sin HTTPS adelante).
      COOKIE_SEGURA: ${COOKIE_SEGURA:-true}
      # Nginx del host + Nginx del contenedor web: la IP real está 2 saltos atrás.
      TRUST_PROXY: 2
      DATA_DIR: /data
      PORT: 4400
      USUARIOS_ARCHIVO: /app/usuarios.json
      # Token con el que el panel de apps pide la lista de usuarios (vacío = sin sincronización).
      PANEL_SYNC_TOKEN: ${PANEL_SYNC_TOKEN:-}
    volumes:
      - juegos_datos:/data
      # Fuera de git: copiar usuarios.example.json y completar los hashes.
      - ./usuarios.json:/app/usuarios.json:ro
    mem_limit: 192m

  web:
    # Desde la raíz: el front usa la lógica de los juegos (api/src) para la vista previa.
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-4400}:80"
    mem_limit: 64m
    depends_on:
      - api

volumes:
  juegos_datos:
